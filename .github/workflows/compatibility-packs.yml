name: Version compatibility packs
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/package.py --all-versions
      - name: Verify bundle and every inner shaderpack
        run: |
          python - <<'PY'
          import hashlib, io, json, zipfile
          from pathlib import Path
          p=Path("dist/LumenWeave-Shaders-All-Versions.zip")
          with zipfile.ZipFile(p) as bundle:
              assert bundle.testzip() is None
              manifest=json.loads(bundle.read("manifest.json"))
              assert len(manifest["packs"]) == 3
              for item in manifest["packs"]:
                  data=bundle.read(item["file"])
                  assert hashlib.sha256(data).hexdigest()==item["sha256"]
                  with zipfile.ZipFile(io.BytesIO(data)) as pack:
                      assert pack.testzip() is None
                      assert "shaders/shaders.properties" in pack.namelist()
                      assert b"LW_DIMENSION_END" in pack.read("shaders/world1/gbuffers_terrain.fsh")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LumenWeave-Shaders-All-Versions
          path: |
            dist/LumenWeave-Shaders-MC-*.zip
            dist/LumenWeave-Shaders-MC-*.zip.sha256
            dist/LumenWeave-Shaders-All-Versions.zip
            dist/LumenWeave-Shaders-All-Versions.zip.sha256
          if-no-files-found: error
